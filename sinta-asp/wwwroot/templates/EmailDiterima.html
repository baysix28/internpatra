<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background-color: #f4f4f4; }
        .email-wrapper { background-color: #f4f4f4; padding: 20px; }
        .email-body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            line-height: 1.6; 
            color: #333; 
            max-width: 750px; 
            margin: 0 auto; 
            padding: 40px; 
            background-color: #ffffff;
            border-top: 6px solid #00549B; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header { 
            text-align: center; 
            margin-bottom: 30px; 
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .content { 
            text-align: justify; 
            /* Memastikan enter/baris baru dari teks biasa tetap terbaca di HTML */
            white-space: pre-wrap; 
            font-size: 15px;
        }
        .status-box { 
            background: #f0f7ff; 
            border: 2px dashed #00549B; 
            padding: 15px; 
            text-align: center; 
            font-weight: 800; 
            font-size: 20px; 
            color: #00549B; 
            margin: 25px 0;
            letter-spacing: 2px;
        }
        .signature { 
            margin-top: 40px; 
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-weight: bold; 
            color: #00549B;
            line-height: 1.4;
        }
        .footer { 
            margin-top: 30px; 
            font-size: 11px; 
            color: #888; 
            text-align: center;
        }
        /* Mengatur agar teks bold di dalam konten tetap terlihat jelas */
        .content strong { color: #000; }
    </style>
</head>
<body>
    <div class="email-wrapper">
        <div class="email-body">
            <div class="header">
                <img src="https://www.pertamina.com/img/logo.png" alt="Pertamina" style="height: 50px;">
            </div>
            
            <div class="content">
{IsiPesan}
            </div>

            <div class="signature">
                Salam hormat,<br>
                Human Capital Jawa Bagian Tengah<br>
                PT Pertamina Patra Niaga Regional Jawa Bagian Tengah
            </div>

            <div class="footer">
                <p>Pesan ini dikirimkan secara otomatis oleh Sistem <strong>SINTA ASP</strong> (Sistem Informasi Magang).<br>
                Harap tidak membalas email ini secara langsung.</p>
            </div>
        </div>
    </div>
</body>
</html>
