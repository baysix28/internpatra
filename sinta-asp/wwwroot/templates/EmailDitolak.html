<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background-color: #f4f4f4; }
        .email-wrapper { background-color: #f4f4f4; padding: 20px; }
        .email-body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            line-height: 1.6; 
            color: #333; 
            max-width: 750px; 
            margin: 0 auto; 
            padding: 40px; 
            background-color: #ffffff;
            border-top: 6px solid #ec1c24; /* Warna merah Pertamina untuk notifikasi penolakan/update */
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header { 
            text-align: center; 
            margin-bottom: 30px; 
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .content { 
            text-align: justify; 
            white-space: pre-wrap; 
            font-size: 15px;
            color: #444;
        }
        .status-badge {
            display: inline-block;
            background-color: #fef2f2;
            color: #991b1b;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid #fee2e2;
        }
        .signature { 
            margin-top: 40px; 
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-weight: bold; 
            color: #333;
            line-height: 1.4;
        }
        .footer { 
            margin-top: 30px; 
            font-size: 11px; 
            color: #999; 
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="email-wrapper">
        <div class="email-body">
            <div class="header">
                <img src="https://www.pertamina.com/img/logo.png" alt="Pertamina" style="height: 50px;">
            </div>
            
            <div class="status-badge">Informasi Status Pendaftaran</div>

            <div class="content">
{IsiPesan}
            </div>

            <div class="signature">
                Salam hormat,<br>
                Human Capital Jawa Bagian Tengah<br>
                PT Pertamina Patra Niaga Regional Jawa Bagian Tengah
            </div>

            <div class="footer">
                <p>Pesan ini dikirimkan secara otomatis oleh Sistem <strong>SINTA ASP</strong>.<br>
                Email ini bersifat informasi satu arah, mohon untuk tidak membalas email ini.</p>
            </div>
        </div>
    </div>
</body>
</html>
